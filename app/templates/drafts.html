<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Drafts &mdash; Juriscite</title>
  <link rel="stylesheet" href="/static/style.css"/>
  <style>
    .drafts-wrap { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    .drafts-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem; }
    .drafts-head h1 { font-size:1.35rem; font-weight:800; letter-spacing:-.03em; color:var(--text); margin:0; }
    .draft-card {
      background: var(--surface); border:1px solid var(--border); border-radius:var(--radius);
      padding:1rem 1.15rem; margin-bottom:.85rem;
    }
    .draft-card-top { display:flex; align-items:center; gap:.75rem; margin-bottom:.5rem; }
    .draft-title { font-weight:700; color:var(--text); font-size:.95rem; flex:1; }
    .badge-status { font-size:.66rem; font-weight:800; letter-spacing:.04em; padding:.18rem .55rem; border-radius:20px; white-space:nowrap; }
    .st-review   { background:rgba(217,119,6,.12); color:#d97706; }
    .st-approved { background:rgba(5,150,105,.12); color:#059669; }
    .draft-meta { font-size:.72rem; color:var(--text-3); margin-bottom:.6rem; }
    .draft-preview { font-family:'Georgia',serif; font-size:.8rem; color:var(--text-2); line-height:1.6;
      max-height:120px; overflow:hidden; white-space:pre-wrap; border-top:1px solid var(--border); padding-top:.6rem; }
    .draft-actions { display:flex; gap:.5rem; margin-top:.75rem; }
    .da-btn { border:1px solid var(--border); border-radius:var(--radius-sm); padding:.4rem .8rem;
      font-size:.74rem; font-weight:700; cursor:pointer; background:transparent; color:var(--text-2); }
    .da-approve { background:linear-gradient(135deg,var(--gold-bright,#F2D47A),var(--gold,#C8A96A)); color:#0B0F14; border:none; }
    .da-btn:hover { border-color:rgba(200,169,106,.4); }
    .drafts-empty { text-align:center; color:var(--text-3); padding:3rem 1rem; font-size:.9rem; }
    /* version history */
    .versions-panel { margin-top:.75rem; border-top:1px dashed var(--border); padding-top:.6rem; }
    .ver-row { display:flex; align-items:center; gap:.6rem; padding:.4rem 0; font-size:.76rem;
      border-bottom:1px solid var(--border); }
    .ver-row:last-child { border-bottom:none; }
    .ver-no { font-weight:800; color:var(--gold,#C8A96A); min-width:42px; }
    .ver-when { color:var(--text-3); flex:1; }
    .ver-cur { font-size:.6rem; font-weight:800; letter-spacing:.04em; padding:.1rem .4rem;
      border-radius:20px; background:rgba(5,150,105,.13); color:#059669; }
    .ver-link { color:var(--text-2); background:transparent; border:1px solid var(--border);
      border-radius:6px; padding:.25rem .6rem; font-size:.72rem; font-weight:700; cursor:pointer; }
    .ver-link:hover { border-color:rgba(200,169,106,.4); }
    /* modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.66); display:none;
      align-items:center; justify-content:center; z-index:50; padding:1.5rem; }
    .modal-overlay.open { display:flex; }
    .modal-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
      max-width:760px; width:100%; max-height:84vh; display:flex; flex-direction:column; }
    .modal-head { display:flex; align-items:center; justify-content:space-between; gap:1rem;
      padding:1rem 1.25rem; border-bottom:1px solid var(--border); }
    .modal-head h3 { margin:0; font-size:.95rem; color:var(--text); font-weight:800; }
    .modal-x { background:transparent; border:none; color:var(--text-3); font-size:1.3rem; cursor:pointer; line-height:1; }
    .modal-body { padding:1.25rem 1.4rem; overflow:auto; font-family:'Georgia',serif;
      font-size:.85rem; line-height:1.75; color:var(--text-2); white-space:pre-wrap; }
    /* version diff */
    .diff-legend { font-family:system-ui,sans-serif; font-size:.7rem; color:var(--text-3); margin-bottom:.7rem; }
    .diff-legend b { font-weight:700; }
    .diff-view { font-family:'SF Mono',Consolas,'Courier New',monospace; font-size:.76rem;
      line-height:1.55; white-space:pre-wrap; }
    .diff-add { background:rgba(5,150,105,.14); color:#057a55; border-radius:2px; display:block; }
    .diff-del { background:rgba(220,38,38,.12); color:#b91c1c; border-radius:2px; display:block; }
    .diff-ctx { color:var(--text-3); display:block; }
  </style>
</head>
<body>

<nav class="topnav">
  <a class="nav-brand" href="/"><span class="name">Juris</span><span class="ai">cite</span></a>
  <div class="nav-links">
    <a href="/">Dashboard</a>
    <a href="/cases">Cases</a>
    <a href="/diary">Court Diary</a>
    <a href="/library">Legal Library</a>
    <a href="/assistant">AI Assistant</a>
    <a href="/drafting">Drafting Engine</a>
    <a href="/drafts" class="active">Drafts</a>
    <a href="/firm">Firm</a>
  </div>
  <div class="nav-right" id="nav-right"></div>
</nav>

<div class="drafts-wrap">
  <div class="drafts-head">
    <h1>Drafts for review</h1>
    <a href="/drafting" class="btn btn-gold btn-sm">+ New draft</a>
  </div>
  <div style="margin-bottom:1rem">
    <input id="draft-search" type="text" placeholder="Search drafts by title or type&hellip;"
           oninput="renderDraftList(this.value)"
           style="width:100%;max-width:440px;padding:.55rem .8rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text-1)"/>
  </div>
  <div id="drafts-list"><div class="drafts-empty">Loading&hellip;</div></div>
</div>

<div class="modal-overlay" id="ver-modal" onclick="if(event.target===this)closeVerModal()">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="ver-modal-title">Version</h3>
      <button class="modal-x" onclick="closeVerModal()" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="ver-modal-body"></div>
  </div>
</div>

<div id="toast"></div>
<script src="/static/utils.js"></script>
<script>requireAuth();</script>
<script src="/static/drafts_list.js"></script>
</body>
</html>
