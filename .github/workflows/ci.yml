name: CI

# Juriscite CI — full test suite (SQLite + Postgres), datetime-zone lint gate, migration
# integrity, a BLOCKING dependency audit (with documented waivers), and an SBOM artifact.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  # ── Test suite on SQLite (the default dev/CI database) ─────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Deterministic, offline test config (no live AI / no rate limiting).
      RATELIMIT_ENABLED: "0"
      OPENAI_API_KEY: ""
      JWT_SECRET: "ci-test-secret-not-for-prod"
      ENVIRONMENT: test   # security_gate: CI uses throwaway secrets and must declare it
    steps:
      # FULL history, not the default shallow fetch-depth: 1.
      # test_release_ops.py::test_release_json_pins_a_real_commit_in_this_history runs
      # `git merge-base --is-ancestor <pinned commit> HEAD`. In a shallow clone the pinned
      # commit object does not exist, git errors, and the test fails — not because the pin
      # is stale but because CI cannot see the history to judge it. That was the SQLite
      # suite failure across runs #1-#5. The repo is 7.8 MB; full history costs nothing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Install from the LOCK, not requirements.txt. requirements.txt is the intent file
      # and is 23/24 unpinned (`>=` ranges), so installing from it makes every CI run
      # resolve whatever was newest that day — a different environment from the one that
      # was certified locally, and a different one on each run. That is how a suite passes
      # on a developer machine and fails in CI for reasons nobody can reproduce.
      - name: Install runtime dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      # The Chroma vector index is DERIVED from app/legal_corpus/fulltext and is gitignored,
      # so a fresh runner has none. Any test that touches get_collection() then seeds ~8,900
      # chunks inline — 15-25 minutes of CPU embedding, inside a 25-minute job. That is why
      # the suite failed here while passing locally, and it went unnoticed because this lane
      # had never actually run.
      #
      # Key on the corpus contents: a corpus change must rebuild, anything else restores in
      # seconds. The first run on a new corpus still pays the build cost, hence the raised
      # timeout below.
      - name: Cache the vector index (keyed on the corpus)
        uses: actions/cache@v4
        with:
          path: chroma_db
          key: chroma-${{ hashFiles('app/legal_corpus/fulltext/*.json', 'app/legal_corpus/*.json') }}
          restore-keys: chroma-
          # NOTE: `save-always: true` was used here and GitHub now warns it "does not work
          # as intended and will be removed". The documented replacement is a separate
          # actions/cache/restore + actions/cache/save pair. Removed rather than left in
          # place: an input that does not do what its name says is worse than no input,
          # because it reads as a solved problem. Tracked in OWNER_QUEUE.

      - name: Generate SBOM (CycloneDX, from the installed runtime environment)
        run: |
          pip install cyclonedx-bom==7.3.0
          cyclonedx-py environment --of JSON --output-reproducible -o sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json

      - name: Lint — datetime-zone regression gate (BLOCKING)
        run: |
          pip install ruff==0.15.22
          # pyproject.toml scopes ruff to the DTZ ruleset, so this gate is about datetime
          # correctness (no naive utcnow/now regressions), not broad style.
          ruff check . --output-format=github

      - name: Migration integrity (single head + head matches models)
        run: pytest tests/test_migrations.py -q

      - name: Full test suite (SQLite)
        run: pytest tests/ -q --junitxml=junit-sqlite.xml

      # A machine-readable result, uploaded even when the suite fails — especially then.
      # Diagnosing run #10 meant scraping 5,000 lines of rendered HTML out of the Actions web
      # UI in a browser, because the annotations API returns only "Process completed with exit
      # code 1" and the logs API needs an authenticated token. A JUnit XML artifact gives every
      # test id, outcome, duration and failure message without any of that.
      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-sqlite
          path: junit-sqlite.xml

      # Emit one ANNOTATION per failing test. Logs and artifact downloads both require an
      # authenticated token; annotations do not, so this is the only route by which a red run
      # is diagnosable from the API alone. Never changes the result — the suite step's own
      # exit code already failed the job.
      - name: Annotate failing tests (SQLite)
        if: failure()
        run: python .github/scripts/annotate_junit.py junit-sqlite.xml "SQLite"

  # ── Postgres parity: the Aurora rehearsal (S0.4) ───────────────────────────────
  test-postgres:
    runs-on: ubuntu-latest
    # 782 tests at Postgres latency — every query is a socket round-trip to the
    # service container, several times slower than SQLite in-process. Run #4 was
    # CANCELLED at 45m having not finished. 90m is a real budget, not a guess at
    # one: the SQLite suite takes ~8m locally and Postgres is plausibly 3-5x that,
    # plus a cold vector-index seed on the first run.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: juriscite
          POSTGRES_PASSWORD: juriscite
          POSTGRES_DB: juriscite_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U juriscite"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RATELIMIT_ENABLED: "0"
      OPENAI_API_KEY: ""
      JWT_SECRET: "ci-test-secret-not-for-prod"
      ENVIRONMENT: test   # security_gate: CI uses throwaway secrets and must declare it
      # The app + Alembic read DATABASE_URL; psycopg v3 driver.
      DATABASE_URL: "postgresql+psycopg://juriscite:juriscite@localhost:5432/juriscite_ci"
    steps:
      # FULL history, not the default shallow fetch-depth: 1.
      # test_release_ops.py::test_release_json_pins_a_real_commit_in_this_history runs
      # `git merge-base --is-ancestor <pinned commit> HEAD`. In a shallow clone the pinned
      # commit object does not exist, git errors, and the test fails — not because the pin
      # is stale but because CI cannot see the history to judge it. That was the SQLite
      # suite failure across runs #1-#5. The repo is 7.8 MB; full history costs nothing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Install from the LOCK, not requirements.txt. requirements.txt is the intent file
      # and is 23/24 unpinned (`>=` ranges), so installing from it makes every CI run
      # resolve whatever was newest that day — a different environment from the one that
      # was certified locally, and a different one on each run. That is how a suite passes
      # on a developer machine and fails in CI for reasons nobody can reproduce.
      - name: Install runtime dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      # The Chroma vector index is DERIVED from app/legal_corpus/fulltext and is gitignored,
      # so a fresh runner has none. Any test that touches get_collection() then seeds ~8,900
      # chunks inline — 15-25 minutes of CPU embedding, inside a 25-minute job. That is why
      # the suite failed here while passing locally, and it went unnoticed because this lane
      # had never actually run.
      #
      # Key on the corpus contents: a corpus change must rebuild, anything else restores in
      # seconds. The first run on a new corpus still pays the build cost, hence the raised
      # timeout below.
      - name: Cache the vector index (keyed on the corpus)
        uses: actions/cache@v4
        with:
          path: chroma_db
          key: chroma-${{ hashFiles('app/legal_corpus/fulltext/*.json', 'app/legal_corpus/*.json') }}
          restore-keys: chroma-
          # NOTE: `save-always: true` was used here and GitHub now warns it "does not work
          # as intended and will be removed". The documented replacement is a separate
          # actions/cache/restore + actions/cache/save pair. Removed rather than left in
          # place: an input that does not do what its name says is worse than no input,
          # because it reads as a solved problem. Tracked in OWNER_QUEUE.

      # BLOCKING: applying every migration on real Postgres is the core Aurora rehearsal —
      # it catches DDL that works on SQLite but not Postgres, the classic deploy-day failure.
      - name: Alembic upgrade head (real Postgres — surfaces SQLite-only DDL)
        run: alembic upgrade head

      # BLOCKING (promoted 2026-07-30). The conftest harness runs the full suite against
      # real Postgres, not SQLite-in-disguise.
      #
      # This was previously `continue-on-error: true`, "advisory until a first green run
      # confirms no further SQLite-only test assumptions remain". That condition could never
      # be met: the lane has never executed once — there is no git remote — so it was
      # waiting for evidence it was configured never to produce. An advisory gate reports
      # nothing; a red run that fails nothing is indistinguishable from a green one.
      #
      # The two obvious SQLite-only assumptions were checked before promoting:
      #   * backups already branch on the driver and the tests already assert
      #     status == "aurora_managed" on Postgres (tests/test_backups.py IS_SQLITE)
      #   * no LIKE/ilike usage anywhere in app/ or tests/, so the case-sensitivity
      #     difference does not arise
      #
      # If the first real run is red, that is the point: it surfaces the remaining
      # assumptions instead of hiding them. Read the failures, do not re-disable this.
      # -v, not -q, and ONE LINE PER TEST on purpose.
      #
      # Runs #4, #5 and #7 were all cancelled at the timeout (45m, 90m, 90m) having emitted
      # roughly FOURTEEN lines of pytest output in an hour and a half. `-q` prints progress
      # dots as tests complete, so near-zero output means this lane HANGS rather than runs
      # slowly — and a hang is invisible in the log because the test that never finishes is
      # the one that never prints.
      #
      # With -v pytest writes each test's name BEFORE running it, so the last line in a
      # cancelled log names the culprit exactly. --durations then ranks the slow ones if it
      # turns out to be many small stalls rather than one block.
      #
      # This is diagnosis, not a fix. It does not weaken the gate: the step still fails on
      # any test failure, and the lane stays blocking.
      - name: Full test suite (Postgres)
        run: pytest tests/ -v --durations=25 --junitxml=junit-postgres.xml

      # Uploaded even on failure — see the note in the SQLite job. This is the lane where it
      # matters most: it is the one that cannot be reproduced locally (no Docker or Postgres
      # on the dev box), so the CI artifact is the only evidence there is.
      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-postgres
          path: junit-postgres.xml

      # Emit one ANNOTATION per failing test. Logs and artifact downloads both require an
      # authenticated token; annotations do not, so this is the only route by which a red run
      # is diagnosable from the API alone. Never changes the result — the suite step's own
      # exit code already failed the job.
      - name: Annotate failing tests (Postgres)
        if: failure()
        run: python .github/scripts/annotate_junit.py junit-postgres.xml "Postgres"

  # ── Dependency audit: BLOCKING, with documented waivers ────────────────────────
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # FULL history, not the default shallow fetch-depth: 1.
      # test_release_ops.py::test_release_json_pins_a_real_commit_in_this_history runs
      # `git merge-base --is-ancestor <pinned commit> HEAD`. In a shallow clone the pinned
      # commit object does not exist, git errors, and the test fails — not because the pin
      # is stale but because CI cannot see the history to judge it. That was the SQLite
      # suite failure across runs #1-#5. The repo is 7.8 MB; full history costs nothing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: pip-audit (fails on any unwaived known CVE in the LOCKED dependency set)
        run: |
          pip install pip-audit==2.10.1
          # Waivers are documented, justified vuln ids in security/pip-audit-waivers.txt.
          IGNORES=$(grep -vE '^\s*#|^\s*$' security/pip-audit-waivers.txt | awk '{print "--ignore-vuln " $1}' | tr '\n' ' ')
          echo "Applying waivers: $IGNORES"
          pip-audit -r requirements.lock $IGNORES
