# Juriscite pre-commit hooks (S0.5).
# Install once:  pre-commit install
# Run on demand: pre-commit run --all-files
#
# Hooks run on STAGED files, so they normalize the codebase gradually as files are touched —
# no big-bang reformat. A one-time full `ruff format` (154 files as of 2026-07-21) is
# deliberately DEFERRED to its own formatting-only change so it doesn't bury real diffs
# (see docs/OWNER_QUEUE.md).

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]   # keep the ChromaDB / PDFs out of the repo (they live on D:)
      - id: detect-private-key

  # Lint (datetime-zone regression gate + more) and format — scoped by pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Secret scanning — the baseline (.secrets.baseline) records the audited clean state;
  # the hook fails the commit if a NEW secret appears.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: (?x)^(
          venv/.*|
          .*\.min\.js|
          mobile/www/.*|
          chroma_db/.*|
          sbom\.json|
          .*\.lock
          )$
